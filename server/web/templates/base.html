<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}云智助手 2api{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #f5f7fa; color: #2c3e50; font-size: 14px; }
    .nav { background: #2c3e50; color: #fff; padding: 0 24px; display: flex; align-items: center; height: 56px; }
    .nav .brand { font-weight: 600; font-size: 16px; margin-right: 32px; }
    .nav a { color: #ecf0f1; text-decoration: none; padding: 0 16px; height: 56px; line-height: 56px; display: inline-block; }
    .nav a:hover, .nav a.active { background: #34495e; }
    .nav .right { margin-left: auto; font-size: 13px; opacity: 0.8; }
    .container { max-width: 1280px; margin: 24px auto; padding: 0 24px; }
    .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .card h2 { margin: 0 0 16px 0; font-size: 16px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .stat { background: #fff; padding: 18px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .stat .v { font-size: 26px; font-weight: 600; color: #2c3e50; }
    .stat .l { font-size: 12px; color: #7f8c8d; margin-top: 4px; }
    .stat.green .v { color: #27ae60; } .stat.red .v { color: #c0392b; } .stat.blue .v { color: #2980b9; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #ecf0f1; }
    th { background: #f8f9fa; font-weight: 600; color: #34495e; }
    tr:hover { background: #f8f9fa; }
    .btn { display: inline-block; padding: 6px 12px; background: #3498db; color: #fff; border: none; border-radius: 4px;
      cursor: pointer; font-size: 13px; text-decoration: none; }
    .btn:hover { background: #2980b9; }
    .btn-sm { padding: 3px 8px; font-size: 12px; }
    .btn-danger { background: #e74c3c; } .btn-danger:hover { background: #c0392b; }
    .btn-warn { background: #f39c12; } .btn-warn:hover { background: #d35400; }
    .btn-success { background: #27ae60; } .btn-success:hover { background: #16a085; }
    .btn-secondary { background: #95a5a6; } .btn-secondary:hover { background: #7f8c8d; }
    input, select, textarea { padding: 6px 10px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 13px; font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #3498db; }
    .form-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; }
    .form-row label { min-width: 100px; }
    .form-row input, .form-row select { flex: 1; }
    .form-row .btn { flex: 0 0 auto; }
    .alert { padding: 10px 16px; border-radius: 4px; margin-bottom: 16px; }
    .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    .alert-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    code, pre { font-family: "SF Mono", Monaco, Consolas, monospace; font-size: 12px; }
    pre { background: #f8f9fa; padding: 12px; border-radius: 4px; overflow-x: auto; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
    .badge-success { background: #d4edda; color: #155724; }
    .badge-danger { background: #f8d7da; color: #721c24; }
    .badge-warn { background: #fff3cd; color: #856404; }
    .badge-secondary { background: #e2e3e5; color: #383d41; }
    .text-success { color: #27ae60; }
    .text-danger { color: #c0392b; }
    .text-muted { color: #7f8c8d; }
    .pagination a, .pagination span { padding: 4px 10px; margin-right: 4px; border: 1px solid #ddd; border-radius: 3px; text-decoration: none; color: #3498db; }
    .pagination .active { background: #3498db; color: #fff; border-color: #3498db; }
  </style>
</head>
<body>
  {% if current_user %}
  <div class="nav">
    <span class="brand">☁️ 云智助手 2api</span>
    <a href="/admin/" class="{% if request.url.path == '/admin/' or request.url.path == '/admin' %}active{% endif %}">仪表盘</a>
    <a href="/admin/accounts" class="{% if '/accounts' in request.url.path %}active{% endif %}">账号管理</a>
    <a href="/admin/api-keys" class="{% if '/api-keys' in request.url.path %}active{% endif %}">API Keys</a>
    <a href="/admin/usage" class="{% if '/usage' in request.url.path %}active{% endif %}">日志统计</a>
    <span class="right">
      <form method="post" action="/admin/logout" style="display:inline"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit" style="background:none;border:0;color:#ecf0f1;cursor:pointer;font:inherit">退出登录</button></form>
    </span>
  </div>
  {% endif %}
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
