services:
  yzzs-2api:
    build: .
    image: yzzs-2api:local
    container_name: yzzs-2api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CTYUN_HOST: 0.0.0.0
      CTYUN_PORT: 10088
      CTYUN_DATA_DIR: /app/data
      CTYUN_ADMIN_USERNAME: ${CTYUN_ADMIN_USERNAME:-admin}
      CTYUN_ADMIN_PASSWORD: ${CTYUN_ADMIN_PASSWORD:?请在.env中设置CTYUN_ADMIN_PASSWORD}
      CTYUN_ADMIN_SECRET: ${CTYUN_ADMIN_SECRET:-}
      CTYUN_ADMIN_SECURE_COOKIE: ${CTYUN_ADMIN_SECURE_COOKIE:-true}
    ports:
      - "${YZZS_PORT:-10087}:10088"
    volumes:
      - yzzs-data:/app/data

  toolforge:
    build:
      context: ./vendor/toolforge
    image: yzzs-toolforge:local
    container_name: yzzs-toolforge
    restart: unless-stopped
    depends_on:
      yzzs-2api:
        condition: service_healthy
    environment:
      TOOLFORGE_CONFIG: /app/config.yaml
    volumes:
      - ./toolforge.config.yaml:/app/config.yaml:ro
    ports:
      - "${TOOLFORGE_PORT:-10090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  yzzs-data:
