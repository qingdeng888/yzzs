services:
  yzzs-2api:
    build: .
    image: yzzs-2api:latest
    container_name: yzzs-2api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内固定:监听所有网卡 + 端口 10088 + 数据落卷 /app/data
      CTYUN_HOST: 0.0.0.0
      CTYUN_PORT: 10088
      CTYUN_DATA_DIR: /app/data
      # 管理员配置(从 .env 读取,environment 优先级高于 env_file,这里显式透传)
      CTYUN_ADMIN_USERNAME: ${CTYUN_ADMIN_USERNAME:-admin}
      CTYUN_ADMIN_PASSWORD: ${CTYUN_ADMIN_PASSWORD:?请在.env中设置CTYUN_ADMIN_PASSWORD}
      CTYUN_ADMIN_SECRET: ${CTYUN_ADMIN_SECRET:-}
      CTYUN_ADMIN_SECURE_COOKIE: ${CTYUN_ADMIN_SECURE_COOKIE:-true}
      CTYUN_INTERNAL_API_KEY: ${YZZS_API_KEY:?请在.env中设置YZZS_API_KEY}
    ports:
      - "${YZZS_PORT:-10087}:10088"
    volumes:
      # 持久化:SQLite + 日志全部写入命名卷,容器重建不丢数据
      - yzzs-data:/app/data

  toolforge:
    build:
      context: ./vendor/toolforge
    image: yzzs-toolforge:latest
    container_name: yzzs-toolforge
    restart: unless-stopped
    depends_on:
      yzzs-2api:
        condition: service_healthy
    environment:
      TOOLFORGE_CONFIG: /app/config.yaml
      TOOLFORGE_API_KEY: ${TOOLFORGE_API_KEY:?请在.env中设置TOOLFORGE_API_KEY}
      YZZS_API_KEY: ${YZZS_API_KEY:?请在.env中设置YZZS_API_KEY}
    volumes:
      - ./toolforge.config.yaml:/app/config.yaml:ro
    ports:
      - "${TOOLFORGE_PORT:-10090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  yzzs-data:
