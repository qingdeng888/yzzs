# 云智助手 2api 配置文件
# 复制为 config.yaml 后修改

server:
  host: 0.0.0.0
  port: 8080
  workers: 1
  log_level: INFO

admin:
  username: admin
  password: ""             # 首次启动必须设置，推荐使用环境变量
  session_secret: ""       # 留空时在 data_dir 自动生成并持久化
  session_expire_hours: 24
  secure_cookie: true       # 本机纯 HTTP 调试时可设为 false

database:
  url: sqlite:///./data/ctyun.db
  echo: false

api:
  rate_limit:
    requests_per_minute: 60
    requests_per_day: 5000
  default_daily_quota: 1000
  default_monthly_quota: 20000
  retry_max: 2
  retry_cooldown_seconds: 60
  session_refresh_skew_seconds: 300   # 提前 5 分钟续期
  enable_web_search_default: true
  auto_disable_on_iam_40050: true     # IAM 风控后自动禁用账号

logging:
  level: INFO
  file: ./data/ctyun.log
