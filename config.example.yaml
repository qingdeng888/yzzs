# 云智助手 2api 配置文件
# 复制为 config.yaml 后修改

server:
  host: 0.0.0.0
  port: 8080
  workers: 1
  log_level: INFO

admin:
  username: admin
  password: changeme       # 首次启动会 bcrypt 入库,之后改 DB
  session_secret: ""        # 留空自动生成,改此值会作废所有后台登录态
  session_expire_hours: 24

database:
  url: sqlite:///./data/ctyun.db
  echo: false

api:
  rate_limit:
    requests_per_minute: 60
    requests_per_day: 5000
  default_daily_quota: 1000
  default_monthly_quota: 20000
  retry_max: 2
  retry_cooldown_seconds: 60
  session_refresh_skew_seconds: 300   # 提前 5 分钟续期
  enable_web_search_default: true
  auto_disable_on_iam_40050: true     # IAM 风控后自动禁用账号

logging:
  level: INFO
  file: ./data/ctyun.log
